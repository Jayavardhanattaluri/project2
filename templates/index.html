<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tution Courses</title>
    <style>
        :root {
            --primary: #0056d2;
            --text: #1f1f1f;
            --muted: #6c6f73;
            --bg: #f6f7fb;
        }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        .hero {
            max-width: 1100px;
            margin: 60px auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        h1 {
            margin-top: 0;
            font-size: 2.2rem;
        }
        p {
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.5;
        }
        .actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-weight: 700;
            display: inline-block;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-secondary {
            border: 1px solid #d9dce5;
            color: var(--text);
            background: white;
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Learn job-ready skills with expert-led courses</h1>
        <p>
            Explore high-quality technology and computer science courses designed to help you grow your career.
            Browse the catalog, compare instructors, and start learning today.
        </p>
        <div class="actions">
            <a class="btn btn-primary" href="{{ url_for('courses') }}">Browse Courses</a>
            <a class="btn btn-secondary" href="{{ url_for('login') }}">Login</a>
            <a class="btn btn-secondary" href="{{ url_for('register') }}">Sign Up</a>
        </div>
    </div>
</body>
</html>
